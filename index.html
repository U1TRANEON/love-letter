<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Я тебя люблю</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&display=swap" rel="stylesheet">
<style>
  :root { --bg: #0a0410; --text: #ffe6f1; --pink: 255, 92, 170; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
  #c.drag { cursor: grabbing; }
  #c.photo { cursor: default; }
  .hint { position: fixed; top: max(18px, env(safe-area-inset-top)); left: 0; right: 0; text-align: center;
    color: rgba(255, 220, 235, .5); font: 13px/1.4 "Segoe UI", system-ui, sans-serif; letter-spacing: .04em;
    pointer-events: none; transition: opacity 1.2s; }
  .ui { position: fixed; left: 0; right: 0; bottom: max(26px, env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: center; gap: 12px; pointer-events: none; }
  .caption { font-family: "Marck Script", "Segoe Script", cursive; color: var(--text);
    font-size: clamp(28px, 6.5vw, 46px); line-height: 1; opacity: 0; transform: translateY(10px);
    transition: opacity 1.4s ease, transform 1.4s ease; text-shadow: 0 0 18px rgba(var(--pink), .8); }
  .caption.show { opacity: 1; transform: none; }
  .caption small { display: block; margin-top: 8px; font: 400 clamp(13px, 2.6vw, 16px)/1.3 "Segoe UI", system-ui, sans-serif;
    letter-spacing: .06em; color: rgba(255, 220, 236, .75); text-shadow: 0 0 10px rgba(var(--pink), .5); }
  .caption { text-align: center; }
  button { pointer-events: auto; font: 500 17px/1 "Segoe UI", system-ui, sans-serif; color: #fff;
    padding: 16px 32px; border-radius: 999px; border: 1px solid rgba(255, 150, 195, .55);
    background: rgba(var(--pink), .16); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    cursor: pointer; letter-spacing: .03em; animation: pulse 2.4s ease-in-out infinite;
    transition: background .3s, opacity .6s, transform .2s; }
  button { margin-top: 18px; }   /* breathing room between the caption and the button */
  button:hover { background: rgba(var(--pink), .3); }
  button:active { transform: scale(.96); }
  button.hide { opacity: 0; pointer-events: none; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 16px rgba(var(--pink), .3), inset 0 0 10px rgba(var(--pink), .15); }
    50% { box-shadow: 0 0 40px rgba(var(--pink), .7), inset 0 0 16px rgba(var(--pink), .3); }
  }
</style>
</head>

<canvas id="c"></canvas>
<div class="hint" id="hint">крути галактику пальцем или мышкой</div>
<div class="ui" id="ui">
  <div class="caption" id="caption">Я тебя люблю<small>на всех языках мира</small></div>
  <button id="btn">нажми, если скучаешь</button>
</div>

}

const img = new Image();
img.onload = () => { preparePhoto(img); resize(); requestAnimationFrame(t => { last = t; frame(t); }); };
img.src = PHOTO;
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (W) resize(); });
</script>
